[project]
name = "hoppay-agentic-treasury-studio"
version = "1.0.0"
description = "Autonomous AI CFO & Policy-Gated Multi-Hop Solana USDC/USDG Treasury Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nguyen Quang (@quangnguyen2512)" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
